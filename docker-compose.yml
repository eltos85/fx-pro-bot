      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - .env
    environment:
      SOLANA_DATA_DIR: /data
      SOLANA_LOG_LEVEL: ${SOLANA_LOG_LEVEL:-INFO}
      SOLANA_ENABLED: ${SOLANA_ENABLED:-false}
      SOLANA_TRADING_ENABLED: ${SOLANA_TRADING_ENABLED:-false}
      SOLANA_PRIVATE_KEY: ${SOLANA_PRIVATE_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      SOLANA_JUPITER_API_KEY: ${SOLANA_JUPITER_API_KEY:-}
      SOLANA_TELEGRAM_ENABLED: ${SOLANA_TELEGRAM_ENABLED:-false}
      SOLANA_TELEGRAM_BOT_TOKEN: ${SOLANA_TELEGRAM_BOT_TOKEN:-${SCALP_TELEGRAM_BOT_TOKEN:-}}
      SOLANA_TELEGRAM_CHAT_ID: ${SOLANA_TELEGRAM_CHAT_ID:-${SCALP_TELEGRAM_CHAT_ID:-}}
    volumes:
      - solana_bot_data:/data

  # ─── hybrid-bot: регулярная фиксация тренда от своей средней цены ────────
  # Полностью изолирован. Стратегия — STRATEGY_HYBRID.md §17.4, порог — §17.6:
  # покупка по SMA20/50 4h, закрытие СВОЕГО объёма целиком на заданном
  # расстоянии от средней цены входа, сразу обратный вход.
  #
  # Стоп/тейк на позицию (tpslMode=Full) не ставится никогда: такой ордер
  # закрывает весь лот на счёте, включая объём других ботов — именно из разбора
  # этой путаницы и выросла стратегия (§17.1).
  #
  # Занял место flowzone-bot и наследует его ключи, том и Telegram-канал.
  hybrid-bot:
    build:
      context: .
      dockerfile: Dockerfile.hybrid-bot
    image: hybrid-bot:local
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - .env
    environment:
      HYBRID_DATA_DIR: /data
      HYBRID_LOG_LEVEL: ${HYBRID_LOG_LEVEL:-INFO}
      # Замер сделан на эфире (§17), поэтому он и по умолчанию.
      HYBRID_SYMBOLS: ${HYBRID_SYMBOLS:-ETHUSDT}
      HYBRID_INTERVAL: ${HYBRID_INTERVAL:-240}
      HYBRID_POLL_SEC: ${HYBRID_POLL_SEC:-180}
      # Свои HYBRID_BYBIT_* с дефолтом на ключи предшественника, а затем на
      # ключи ai_trader — чтобы .env на VPS не переписывать.
      HYBRID_BYBIT_API_KEY: ${HYBRID_BYBIT_API_KEY:-${FLOWZONE_BYBIT_API_KEY:-${AI_TRADER_BYBIT_API_KEY:-}}}
      HYBRID_BYBIT_API_SECRET: ${HYBRID_BYBIT_API_SECRET:-${FLOWZONE_BYBIT_API_SECRET:-${AI_TRADER_BYBIT_API_SECRET:-}}}
      HYBRID_BYBIT_DEMO: ${HYBRID_BYBIT_DEMO:-true}
      HYBRID_BYBIT_CATEGORY: ${HYBRID_BYBIT_CATEGORY:-linear}
      # Наблюдение сначала: бот считает и пишет сделки с mode=paper, ордера не
      # отправляет. Включать только после согласования порога (§17.6).
      HYBRID_TRADING_ENABLED: ${HYBRID_TRADING_ENABLED:-false}
      # Расстояние фиксации: серединное расстояние наблюдённых закрытий
      # (§17.3), то есть воспроизведение поведения, а не оптимум по §17.6.
      HYBRID_FIX_THRESHOLD_PCT: ${HYBRID_FIX_THRESHOLD_PCT:-1.0}
      # Капитал и максимальная ставка. На демо-счёте лежит больше, но бот
      # работает так, будто у него $1000: суммарный объём его позиций эту
      # величину не превышает. Меняются только через .env, не в коде.
      HYBRID_VIRTUAL_CAPITAL: ${HYBRID_VIRTUAL_CAPITAL:-1000}
      HYBRID_POSITION_USD: ${HYBRID_POSITION_USD:-200}
      HYBRID_MIN_NOTIONAL_USD: ${HYBRID_MIN_NOTIONAL_USD:-10}
      HYBRID_LEVERAGE: ${HYBRID_LEVERAGE:-1}
      # Telegram — тот же канал, что был у предшественника, префикс [hybrid].
      HYBRID_TELEGRAM_ENABLED: ${HYBRID_TELEGRAM_ENABLED:-${FLOWZONE_TELEGRAM_ENABLED:-false}}
      HYBRID_TELEGRAM_BOT_TOKEN: ${HYBRID_TELEGRAM_BOT_TOKEN:-${FLOWZONE_TELEGRAM_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}}
      HYBRID_TELEGRAM_CHAT_ID: ${HYBRID_TELEGRAM_CHAT_ID:-${FLOWZONE_TELEGRAM_CHAT_ID:-${TELEGRAM_CHAT_ID:-}}}
      HYBRID_TELEGRAM_PREFIX: ${HYBRID_TELEGRAM_PREFIX:-[hybrid]}
    volumes:
      - hybrid_data:/data

  # ─── tradecard-bybit: advisory-ревьюер scalp_bot + hybrid_bot ───────────
  # АНАЛИТИКА (не торговый бот, не автотюнер). Читает БД ботов read-only,
  # считает SMB report card, грейдит по score, гоняет 5 Why через DeepSeek,
  # отдаёт рекомендации человеку. НЕ меняет конфиг/правила ботов и НЕ пишет в
  # их БД (TASKSPEC_TRADECARD_BYBIT.md, STRATEGY_TRADECARD_BYBIT.md). Запуск —
  # периодический (cron/scheduler), не realtime: командой не задаётся CMD,
  # планировщик дёргает `tradecard-bybit daily|weekly --bot scalp|hybrid`.
  tradecard-bybit:
    build:
      context: .
      dockerfile: Dockerfile.tradecard-bybit
    image: tradecard-bybit:local
    restart: "no"
    profiles:
      # Сервис не крутится постоянно — запускается планировщиком/вручную.
      # `docker compose run --rm tradecard-bybit tradecard-bybit daily --bot scalp`
      - tools
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - .env
    environment:
      TRADECARD_BYBIT_DATA_DIR: /data
      # БД ботов монтируются read-only по своим путям (раздельные volume'а).
      TRADECARD_BYBIT_SCALP_DB_DIR: /bots/scalp
      TRADECARD_BYBIT_HYBRID_DB_DIR: /bots/hybrid
      TRADECARD_BYBIT_REPORTS_DIR: /data/tradecard
      TRADECARD_BYBIT_LOG_LEVEL: ${TRADECARD_BYBIT_LOG_LEVEL:-INFO}
      # Baseline анализа = дата последней правки логики бота (UTC, YYYY-MM-DD).
      # Сделки до неё не анализируются (разные стратегии нельзя смешивать).
      TRADECARD_BYBIT_SCALP_BASELINE_DATE: ${TRADECARD_BYBIT_SCALP_BASELINE_DATE:-}
      TRADECARD_BYBIT_HYBRID_BASELINE_DATE: ${TRADECARD_BYBIT_HYBRID_BASELINE_DATE:-}
      # DeepSeek (5 Why, read-only аналитика) — общий ключ.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TRADECARD_BYBIT_DEEPSEEK_API_KEY: ${TRADECARD_BYBIT_DEEPSEEK_API_KEY:-${DEEPSEEK_API_KEY:-}}
      TRADECARD_BYBIT_DEEPSEEK_MODEL: ${TRADECARD_BYBIT_DEEPSEEK_MODEL:-deepseek-v4-flash}
      TRADECARD_BYBIT_FIVE_WHY_ENABLED: ${TRADECARD_BYBIT_FIVE_WHY_ENABLED:-true}
      # Bybit read-only (closedPnl ground truth) — свои ключи с дефолтом на
      # ключи ботов, чтобы аудит был раздельным (TASKSPEC §10).
      TRADECARD_BYBIT_SCALP_BYBIT_API_KEY: ${TRADECARD_BYBIT_SCALP_BYBIT_API_KEY:-${SCALP_BYBIT_API_KEY:-}}
      TRADECARD_BYBIT_SCALP_BYBIT_API_SECRET: ${TRADECARD_BYBIT_SCALP_BYBIT_API_SECRET:-${SCALP_BYBIT_API_SECRET:-}}
      TRADECARD_BYBIT_HYBRID_BYBIT_API_KEY: ${TRADECARD_BYBIT_HYBRID_BYBIT_API_KEY:-${HYBRID_BYBIT_API_KEY:-${AI_TRADER_BYBIT_API_KEY:-}}}
      TRADECARD_BYBIT_HYBRID_BYBIT_API_SECRET: ${TRADECARD_BYBIT_HYBRID_BYBIT_API_SECRET:-${HYBRID_BYBIT_API_SECRET:-${AI_TRADER_BYBIT_API_SECRET:-}}}
      TRADECARD_BYBIT_BYBIT_DEMO: ${TRADECARD_BYBIT_BYBIT_DEMO:-true}
      TRADECARD_BYBIT_CLOSED_PNL_ENABLED: ${TRADECARD_BYBIT_CLOSED_PNL_ENABLED:-true}
      TRADECARD_BYBIT_MFE_ENABLED: ${TRADECARD_BYBIT_MFE_ENABLED:-false}
      # Telegram: раздельные конфиги ботов, префиксы [tradecard-scalp]/[tradecard-hybrid].
      TRADECARD_BYBIT_SCALP_TELEGRAM_ENABLED: ${TRADECARD_BYBIT_SCALP_TELEGRAM_ENABLED:-false}
      TRADECARD_BYBIT_SCALP_TELEGRAM_BOT_TOKEN: ${TRADECARD_BYBIT_SCALP_TELEGRAM_BOT_TOKEN:-${SCALP_TELEGRAM_BOT_TOKEN:-}}
      TRADECARD_BYBIT_SCALP_TELEGRAM_CHAT_ID: ${TRADECARD_BYBIT_SCALP_TELEGRAM_CHAT_ID:-${SCALP_TELEGRAM_CHAT_ID:-}}
      TRADECARD_BYBIT_HYBRID_TELEGRAM_ENABLED: ${TRADECARD_BYBIT_HYBRID_TELEGRAM_ENABLED:-false}
      TRADECARD_BYBIT_HYBRID_TELEGRAM_BOT_TOKEN: ${TRADECARD_BYBIT_HYBRID_TELEGRAM_BOT_TOKEN:-${HYBRID_TELEGRAM_BOT_TOKEN:-}}
      TRADECARD_BYBIT_HYBRID_TELEGRAM_CHAT_ID: ${TRADECARD_BYBIT_HYBRID_TELEGRAM_CHAT_ID:-${HYBRID_TELEGRAM_CHAT_ID:-}}
    volumes:
      # БД ботов — STRICTLY read-only (read-only инвариант §11).
      - scalp_bot_data:/bots/scalp:ro
      - hybrid_data:/bots/hybrid:ro
      # Свой volume: SQLite tradecard + markdown report card.
      - tradecard_bybit_data:/data

  # ─── fx-momentum-bot: isolated FX momentum bot ───────────────────────────
  # Полностью отдельный runtime: свои MOMENTUM_BOT_* env, своя БД/токены в
  # отдельном volume, без использования legacy переменных advisor/scalp/ai.
  fx-momentum-bot:
    build:
      context: .
      dockerfile: Dockerfile.momentum-bot
    image: fx-momentum-bot:local
    restart: unless-stopped
    depends_on:
      ctrader-token-service:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - .env
    environment:
      MOMENTUM_BOT_DATA_DIR: /data
      MOMENTUM_BOT_LOG_LEVEL: ${MOMENTUM_BOT_LOG_LEVEL:-INFO}
      MOMENTUM_BOT_TRADING_ENABLED: ${MOMENTUM_BOT_TRADING_ENABLED:-false}
      MOMENTUM_BOT_POLL_INTERVAL_SEC: ${MOMENTUM_BOT_POLL_INTERVAL_SEC:-300}
      MOMENTUM_BOT_SYMBOLS: ${MOMENTUM_BOT_SYMBOLS:-EURUSD=X,GBPUSD=X,USDJPY=X,AUDUSD=X}
      MOMENTUM_BOT_YFINANCE_INTERVAL: ${MOMENTUM_BOT_YFINANCE_INTERVAL:-1h}
      MOMENTUM_BOT_YFINANCE_PERIOD: ${MOMENTUM_BOT_YFINANCE_PERIOD:-3mo}
      MOMENTUM_BOT_LOOKBACK_BARS: ${MOMENTUM_BOT_LOOKBACK_BARS:-24}
      MOMENTUM_BOT_ATR_PERIOD: ${MOMENTUM_BOT_ATR_PERIOD:-14}
      MOMENTUM_BOT_ATR_STOP_MULT: ${MOMENTUM_BOT_ATR_STOP_MULT:-2.5}
      MOMENTUM_BOT_ATR_TAKE_MULT: ${MOMENTUM_BOT_ATR_TAKE_MULT:-3.5}
      MOMENTUM_BOT_SIGNAL_THRESHOLD: ${MOMENTUM_BOT_SIGNAL_THRESHOLD:-0.0015}
      # Session-фильтр входов (liquid sessions only, 2026-06-26): блок
      # новых входов вне London 07–12 / NY 12–21 UTC. Asian/Late session
      # эмпирически 0% WR (tradecard weekly, cTrader deal-list ground truth,
      # 77 сделок). Сопровождение/выходы НЕ блокируются. Выключить: start==end.
      MOMENTUM_BOT_SESSION_FILTER_ENABLED: ${MOMENTUM_BOT_SESSION_FILTER_ENABLED:-true}
      MOMENTUM_BOT_SESSION_FILTER_START_HOUR_UTC: ${MOMENTUM_BOT_SESSION_FILTER_START_HOUR_UTC:-7}
      MOMENTUM_BOT_SESSION_FILTER_END_HOUR_UTC: ${MOMENTUM_BOT_SESSION_FILTER_END_HOUR_UTC:-21}
      # Friday-flat (2026-06-26): принудительное закрытие momentum-позиций
      # перед выходными (окно в пятницу UTC, до FX close ~21:00). Гэп пн
      # исполняет SL вне 1R (empirically avgR -0.79 weekend-hold vs -0.08
      # intra-week). Сопровождение работает до окна. Новые входы запрещены
      # от FRIDAY_FLAT_START до КОНЦА пятницы UTC (2026-07-02: закрыта дыра
      # 20:45→FX close, когда вход уезжал в выходные). Обратимо:
      # enabled=false (или start==end — отключает только окно закрытия).
      MOMENTUM_BOT_FRIDAY_FLAT_ENABLED: ${MOMENTUM_BOT_FRIDAY_FLAT_ENABLED:-true}
      MOMENTUM_BOT_FRIDAY_FLAT_START: ${MOMENTUM_BOT_FRIDAY_FLAT_START:-20:00}
      MOMENTUM_BOT_FRIDAY_FLAT_END: ${MOMENTUM_BOT_FRIDAY_FLAT_END:-20:45}
      MOMENTUM_BOT_LOT_SIZE: ${MOMENTUM_BOT_LOT_SIZE:-0.01}
      MOMENTUM_BOT_MAX_OPEN_POSITIONS: ${MOMENTUM_BOT_MAX_OPEN_POSITIONS:-3}
      MOMENTUM_BOT_ORDER_LABEL: ${MOMENTUM_BOT_ORDER_LABEL:-momentum-bot}
      # Trader-backed position management:
      # Van Tharp (R-multiples/BE), Linda Raschke (partial + runner),
      # Turtle/LeBeau ATR trailing.
      MOMENTUM_BOT_POSITION_MANAGEMENT_ENABLED: ${MOMENTUM_BOT_POSITION_MANAGEMENT_ENABLED:-true}
      MOMENTUM_BOT_BREAK_EVEN_R: ${MOMENTUM_BOT_BREAK_EVEN_R:-1.0}
      MOMENTUM_BOT_PARTIAL_TAKE_R: ${MOMENTUM_BOT_PARTIAL_TAKE_R:-1.5}
      MOMENTUM_BOT_PARTIAL_TAKE_FRACTION: ${MOMENTUM_BOT_PARTIAL_TAKE_FRACTION:-0.5}
      MOMENTUM_BOT_TRAILING_ACTIVATE_R: ${MOMENTUM_BOT_TRAILING_ACTIVATE_R:-1.5}
      MOMENTUM_BOT_TRAILING_ATR_MULT: ${MOMENTUM_BOT_TRAILING_ATR_MULT:-1.5}
      MOMENTUM_BOT_CTRADER_HOST_TYPE: ${MOMENTUM_BOT_CTRADER_HOST_TYPE:-demo}
      MOMENTUM_BOT_CTRADER_CLIENT_ID: ${MOMENTUM_BOT_CTRADER_CLIENT_ID:-}
      MOMENTUM_BOT_CTRADER_CLIENT_SECRET: ${MOMENTUM_BOT_CTRADER_CLIENT_SECRET:-}
      MOMENTUM_BOT_CTRADER_ACCOUNT_ID: ${MOMENTUM_BOT_CTRADER_ACCOUNT_ID:-0}
      MOMENTUM_BOT_CTRADER_REDIRECT_URI: ${MOMENTUM_BOT_CTRADER_REDIRECT_URI:-https://openapi.ctrader.com/apps/token}
      MOMENTUM_BOT_TOKEN_SERVICE_URL: ${MOMENTUM_BOT_TOKEN_SERVICE_URL:-http://ctrader-token-service:8080}
      MOMENTUM_BOT_TOKEN_SERVICE_SECRET: ${MOMENTUM_BOT_TOKEN_SERVICE_SECRET:-}
      MOMENTUM_BOT_TOKEN_SERVICE_LABEL: ${MOMENTUM_BOT_TOKEN_SERVICE_LABEL:-momentum_bot}
      # Generic CTRADER_TOKEN_SERVICE_* нужны ВНУТРЕННЕМУ CTraderClient:
      # его авто-refresh (_try_refresh_via_service → load_service_config)
      # читает именно эти env, а не MOMENTUM_BOT_*. Без них клиент при
      # silent token-rotation делает ЛОКАЛЬНЫЙ refresh, прокручивая
      # single-use refresh_token напрямую у Spotware → конфликт ротации с
      # fx-ai-trader (Access denied → TCP closed cleanly, reconnect-петля).
      # advisor и fx-ai-trader задают эти же переменные по той же причине.
      CTRADER_TOKEN_SERVICE_URL: ${CTRADER_TOKEN_SERVICE_URL:-http://ctrader-token-service:8080}
      CTRADER_TOKEN_SERVICE_SECRET: ${CTRADER_TOKEN_SERVICE_SECRET:-}
      MOMENTUM_BOT_REQUIRE_TOKEN_SERVICE: ${MOMENTUM_BOT_REQUIRE_TOKEN_SERVICE:-true}
      MOMENTUM_BOT_DB_FILENAME: ${MOMENTUM_BOT_DB_FILENAME:-momentum_bot.sqlite}
      MOMENTUM_BOT_TOKEN_FILENAME: ${MOMENTUM_BOT_TOKEN_FILENAME:-momentum_bot_tokens.json}
    volumes:
      - momentum_bot_data:/data

  # ─── tradecard-momentum: advisory-ревьюер fx_momentum_bot ────────────────
  # АНАЛИТИКА (не торговый бот, не автотюнер). Читает БД momentum read-only
  # (контекст входа) + cTrader deal-list (ground truth по P&L), считает SMB
  # report card, грейдит по силе сигнала, гоняет 5 Why через DeepSeek, отдаёт
  # рекомендации человеку. НЕ меняет конфиг/правила бота и НЕ пишет в его БД
  # (TASKSPEC_TRADECARD_FX.md адаптирован под rule-based momentum). Запуск —
  # периодический (cron/scheduler), не realtime.
  #
  # ⚠️ cTrader-лимит 2 connections per application: momentum + fx-ai-trader уже
  # держат 2 коннекта на общем app (client_id). Для конкурентного запуска
  # tradecard нужен ОТДЕЛЬНЫЙ cTrader-app (TRADECARD_MOMENTUM_CTRADER_CLIENT_ID),
  # иначе запускать в окно, когда слот свободен (api-docs.mdc).
  #   docker compose run --rm tradecard-momentum tradecard-momentum daily
  tradecard-momentum:
    build:
      context: .
      dockerfile: Dockerfile.tradecard-momentum
    image: tradecard-momentum:local
    restart: "no"
    profiles:
      - tools
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - .env
    environment:
      TRADECARD_MOMENTUM_DATA_DIR: /data
      # БД momentum монтируется read-only (свой volume momentum_bot_data).
      TRADECARD_MOMENTUM_MOMENTUM_DB_DIR: /bots/momentum
      TRADECARD_MOMENTUM_REPORTS_DIR: /data/tradecard
      TRADECARD_MOMENTUM_LOG_LEVEL: ${TRADECARD_MOMENTUM_LOG_LEVEL:-INFO}
      # Baseline анализа = дата последней правки логики бота (UTC, YYYY-MM-DD
      # или YYYY-MM-DD HH:MM). Сделки до неё не анализируются (разные стратегии
      # нельзя смешивать). 2026-07-24 — деплой exit-hysteresis + NY-open block
      # + ADX-фильтр + gap-защита (commits 60f386c/a523e6f, BUILDLOG 2026-07-24).
      TRADECARD_MOMENTUM_BASELINE_DATE: ${TRADECARD_MOMENTUM_BASELINE_DATE:-2026-07-24 08:27}
      # DeepSeek (5 Why) — общий ключ.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TRADECARD_MOMENTUM_DEEPSEEK_API_KEY: ${TRADECARD_MOMENTUM_DEEPSEEK_API_KEY:-${DEEPSEEK_API_KEY:-}}
      TRADECARD_MOMENTUM_DEEPSEEK_MODEL: ${TRADECARD_MOMENTUM_DEEPSEEK_MODEL:-deepseek-v4-flash}
      TRADECARD_MOMENTUM_FIVE_WHY_ENABLED: ${TRADECARD_MOMENTUM_FIVE_WHY_ENABLED:-true}
      # cTrader read-only (deal-list ground truth). Свои creds с дефолтами на
      # momentum-бота. Для отдельного connection-budget задать собственный app.
      TRADECARD_MOMENTUM_BROKER_PNL_ENABLED: ${TRADECARD_MOMENTUM_BROKER_PNL_ENABLED:-true}
      TRADECARD_MOMENTUM_CTRADER_HOST_TYPE: ${TRADECARD_MOMENTUM_CTRADER_HOST_TYPE:-${MOMENTUM_BOT_CTRADER_HOST_TYPE:-demo}}
      TRADECARD_MOMENTUM_CTRADER_CLIENT_ID: ${TRADECARD_MOMENTUM_CTRADER_CLIENT_ID:-${MOMENTUM_BOT_CTRADER_CLIENT_ID:-}}
      TRADECARD_MOMENTUM_CTRADER_CLIENT_SECRET: ${TRADECARD_MOMENTUM_CTRADER_CLIENT_SECRET:-${MOMENTUM_BOT_CTRADER_CLIENT_SECRET:-}}
      TRADECARD_MOMENTUM_CTRADER_ACCOUNT_ID: ${TRADECARD_MOMENTUM_CTRADER_ACCOUNT_ID:-${MOMENTUM_BOT_CTRADER_ACCOUNT_ID:-0}}
      TRADECARD_MOMENTUM_TOKEN_SERVICE_URL: ${TRADECARD_MOMENTUM_TOKEN_SERVICE_URL:-${MOMENTUM_BOT_TOKEN_SERVICE_URL:-http://ctrader-token-service:8080}}
      TRADECARD_MOMENTUM_TOKEN_SERVICE_SECRET: ${TRADECARD_MOMENTUM_TOKEN_SERVICE_SECRET:-${MOMENTUM_BOT_TOKEN_SERVICE_SECRET:-}}
      TRADECARD_MOMENTUM_TOKEN_SERVICE_LABEL: ${TRADECARD_MOMENTUM_TOKEN_SERVICE_LABEL:-tradecard_momentum}
      # Generic CTRADER_TOKEN_SERVICE_* нужны внутреннему CTraderClient (авто-refresh).
      CTRADER_TOKEN_SERVICE_URL: ${CTRADER_TOKEN_SERVICE_URL:-http://ctrader-token-service:8080}
      CTRADER_TOKEN_SERVICE_SECRET: ${CTRADER_TOKEN_SERVICE_SECRET:-}
      # Торговая вселенная momentum (атрибуция deal'ов) + SL-множитель ATR (R).
      TRADECARD_MOMENTUM_MOMENTUM_SYMBOLS_RAW: ${MOMENTUM_BOT_SYMBOLS:-EURUSD=X,GBPUSD=X,USDJPY=X,AUDUSD=X}
      TRADECARD_MOMENTUM_ATR_STOP_MULT: ${MOMENTUM_BOT_ATR_STOP_MULT:-2.5}
      # Telegram (свой префикс [tradecard-momentum]).
      TRADECARD_MOMENTUM_TELEGRAM_ENABLED: ${TRADECARD_MOMENTUM_TELEGRAM_ENABLED:-false}
      TRADECARD_MOMENTUM_TELEGRAM_BOT_TOKEN: ${TRADECARD_MOMENTUM_TELEGRAM_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      TRADECARD_MOMENTUM_TELEGRAM_CHAT_ID: ${TRADECARD_MOMENTUM_TELEGRAM_CHAT_ID:-${TELEGRAM_CHAT_ID:-}}
    volumes:
      # БД momentum — STRICTLY read-only (read-only инвариант).
      - momentum_bot_data:/bots/momentum:ro
      # Свой volume: SQLite tradecard + markdown report card.
      - tradecard_momentum_data:/data

volumes:
  scalp_bot_data:
  daytrend_bot_data:
  swing_bot_data:
  impulse_bot_data:
  solana_bot_data:
  hybrid_data:
  momentum_bot_data:
  tradecard_bybit_data:
  tradecard_momentum_data:
