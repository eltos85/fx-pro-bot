      SCALP_SWEEP_FADE_SL_RISK_MULT: ${SCALP_SWEEP_FADE_SL_RISK_MULT:-1.0}
      # v0.18.26 (B) — база sweep_fade пропускает фейд у round-уровня (round00/50).
      # Артефакт scalp_backtest_regime --level-decomp (06-10..15, n=956): round
      # WR 35%/avgR-0.231 ХУЖЕ микро WR 42%/-0.063 (инверсия канона; даунтренд
      # пробивает round, Connors/Raschke). Forward-test с откатом (1 режим/5д,
      # пользователь принял риск). ИЗОЛЯЦИЯ: только база (canon/density не задеты).
      # Откат: false.
      SCALP_SWEEP_FADE_SKIP_ROUND: ${SCALP_SWEEP_FADE_SKIP_ROUND:-true}
      # v0.18.26 (шаг 2) — база sweep_fade: full reclaim 1.0 (CAP Rule 2, как canon).
      # Артефакт --reclaim-frac sweep (06-10..15, n≈950): 0.5→1.0 netR -128→-117
      # (слабо, в канон-сторону). ИЗОЛЯЦИЯ: только база. Откат: 0.5.
      SCALP_SWEEP_FADE_RECLAIM_FRAC: ${SCALP_SWEEP_FADE_RECLAIM_FRAC:-1.0}
      # flow_exit профит-лок. v0.13.0: 1.0→1.5 — sweep 15д (data/scalp_sweep.txt):
      # выше порог = крупнее средний зафиксированный винер, винеры бегут дальше к
      # TP=3.5R (Философия B «let winners run», Schwager/Brooks).
      SCALP_FLOW_EXIT_ACTIVATE_R: ${SCALP_FLOW_EXIT_ACTIVATE_R:-1.5}
      # flow_scratch ВЫКЛЮЧЕН (v0.13.0): контрфактуал + sweep — scratch при −0.7R
      # маргинально вредит (режет 0.3R до SL, убивает ~12% отскоков). Полагаемся
      # на биржевой SL. Меньше путей выхода. true = вернуть ранний скретч.
      SCALP_SCRATCH_ON_FLOW_FLIP: ${SCALP_SCRATCH_ON_FLOW_FLIP:-false}
      SCALP_SCRATCH_MIN_ADVERSE_R: ${SCALP_SCRATCH_MIN_ADVERSE_R:-0.7}
      # HTF-bias (v0.9.3): фейд только по тренду EMA200 (CAP-контекст,
      # Murphy/Asness). Контртренд блокируем; fail-open при сбое свечей.
      # v0.16.0: контекст-ТФ 1H→15m (research: для скальпа контекст 15m —
      # DYOR/VWAP-guide/ChartScout 2026; правило соотношения ТФ). A/B 15д n=6220
      # (data/scalp_htf_ab.txt): gross +0.122R vs +0.087R у 1H (~+40%), 4/6 лучше.
      SCALP_REQUIRE_HTF_TREND: ${SCALP_REQUIRE_HTF_TREND:-true}
      SCALP_HTF_INTERVAL: ${SCALP_HTF_INTERVAL:-15}
      SCALP_HTF_EMA_LEN: ${SCALP_HTF_EMA_LEN:-200}
      SCALP_HTF_REFRESH_SEC: ${SCALP_HTF_REFRESH_SEC:-120}
      # v0.17.0: ADX режим-гейт поверх EMA — не фейдить сильный тренд («never fade
      # a one-timeframe trending market», Connors/Raschke; Wilder ADX 1978).
      # A/B 15д (data/scalp_adx_gate.txt): ema+adx@25 gross +0.140R vs +0.122R EMA.
      SCALP_HTF_ADX_GATE: ${SCALP_HTF_ADX_GATE:-true}
      SCALP_HTF_ADX_LEN: ${SCALP_HTF_ADX_LEN:-14}
      # v0.18.9: 25→30 (под SL ×2.0; корзина 25–30 прибыльна OOS в оба окна,
      # ≥30 нестабильна → режем только strong trend). См. BUILDLOG v0.18.9.
      SCALP_HTF_ADX_MAX: ${SCALP_HTF_ADX_MAX:-30}
      # v0.18.4: асимметричный DMI-гейт направления ТОЛЬКО для лонгов (Wilder DMI
      # +DI/−DI 1978). Диагноз: live лонги 20% WR vs шорты 54% — EMA лагает на
      # даунтренд-альтах. A/B 3 окна (data/scalp_di_long_gate.txt): лонги avgR
      # −0.092/−0.100/−0.098 → +0.004/+0.023/−0.006. Шорты/density_break не тронуты.
      SCALP_HTF_DI_LONG_GATE: ${SCALP_HTF_DI_LONG_GATE:-true}
      # v0.18.0: НЕ флэтить открытые позиции при рестарте — биржевые SL/TP их
      # защищают, manage() продолжает сопровождать (кейс #926: рестарт срезал
      # прибыльный шорт). true = legacy «чистый лист» (закрыть всё по рынку).
      SCALP_FLATTEN_ON_START: ${SCALP_FLATTEN_ON_START:-false}
      # Мин-R пол + риск-сайзинг (v0.8.1): R ≥ 4×fee → fee ≤ 0.25R (R≈0.44%),
      # размер = риск$/дистанция_SL (канон профи), фикс $-риск/сделку.
      SCALP_MIN_RISK_FEE_MULT: ${SCALP_MIN_RISK_FEE_MULT:-4.0}
      SCALP_RISK_BASED_SIZING: ${SCALP_RISK_BASED_SIZING:-true}
      # v0.18.5: $1→$10 фикс-риск/сделку (более крупные позиции по запросу).
      # notional≈$2.3–3.3k, killswitch $500/день = ~50 SL. Откат: =1.
      SCALP_RISK_PER_TRADE_USD: ${SCALP_RISK_PER_TRADE_USD:-10.0}
      # Telegram-нотификации (переиспользуем отдельного бота от ai_arena).
      SCALP_TELEGRAM_ENABLED: ${SCALP_TELEGRAM_ENABLED:-false}
      SCALP_TELEGRAM_BOT_TOKEN: ${SCALP_TELEGRAM_BOT_TOKEN:-}
      SCALP_TELEGRAM_CHAT_ID: ${SCALP_TELEGRAM_CHAT_ID:-}
    volumes:
      - scalp_bot_data:/data

  # ─── daytrend-bot: дневной SMA200 long/flat (Murphy 1999) ───────────────
  # Изолирован от scalp. Демо, те же ключи Bybit по умолчанию. Чужие позиции
  # (скальп на том же символе) не трогает. ORB на часах не используется:
  # scripts/scalp_daytrend_research.py закрыл его (−67% за 2 года на BTC).
  daytrend-bot:
    build:
      context: .
      dockerfile: Dockerfile.horizon-bot
    image: horizon-bot:local
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - .env
    environment:
      HORIZON_NAME: daytrend
      DAYTREND_STRATEGY: sma200_daily
      DAYTREND_INTERVAL: D
      DAYTREND_DATA_DIR: /data
      DAYTREND_SYMBOLS: ${DAYTREND_SYMBOLS:-BTCUSDT,ETHUSDT}
      DAYTREND_POLL_SEC: ${DAYTREND_POLL_SEC:-600}
      DAYTREND_POSITION_FRAC: ${DAYTREND_POSITION_FRAC:-0.15}
      DAYTREND_VIRTUAL_CAPITAL: ${DAYTREND_VIRTUAL_CAPITAL:-1000}
      DAYTREND_LEVERAGE: ${DAYTREND_LEVERAGE:-1}
      DAYTREND_BYBIT_API_KEY: ${DAYTREND_BYBIT_API_KEY:-${SCALP_BYBIT_API_KEY:-}}
      DAYTREND_BYBIT_API_SECRET: ${DAYTREND_BYBIT_API_SECRET:-${SCALP_BYBIT_API_SECRET:-}}
      DAYTREND_BYBIT_DEMO: ${DAYTREND_BYBIT_DEMO:-${SCALP_BYBIT_DEMO:-true}}
      DAYTREND_TRADING_ENABLED: ${DAYTREND_TRADING_ENABLED:-true}
    volumes:
      - daytrend_bot_data:/data

  # ─── swing-bot: 4h SMA 20/50 long/flat (Murphy 1999, свинг ~2–7 дней) ──
  # Форвард на демо: IS/OOS гейт на 2 годах не пройден
  # (scripts/scalp_swing_research.py). Канон не тюнится.
  swing-bot:
    build:
      context: .
      dockerfile: Dockerfile.horizon-bot
    image: horizon-bot:local
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - .env
    environment:
      HORIZON_NAME: swing
      SWING_STRATEGY: sma20_50_4h
      SWING_INTERVAL: "240"
      SWING_DATA_DIR: /data
      SWING_SYMBOLS: ${SWING_SYMBOLS:-BTCUSDT,ETHUSDT}
      SWING_POLL_SEC: ${SWING_POLL_SEC:-180}
      SWING_POSITION_FRAC: ${SWING_POSITION_FRAC:-0.15}
      SWING_VIRTUAL_CAPITAL: ${SWING_VIRTUAL_CAPITAL:-1000}
      SWING_LEVERAGE: ${SWING_LEVERAGE:-1}
      SWING_BYBIT_API_KEY: ${SWING_BYBIT_API_KEY:-${SCALP_BYBIT_API_KEY:-}}
      SWING_BYBIT_API_SECRET: ${SWING_BYBIT_API_SECRET:-${SCALP_BYBIT_API_SECRET:-}}
      SWING_BYBIT_DEMO: ${SWING_BYBIT_DEMO:-${SCALP_BYBIT_DEMO:-true}}
      SWING_TRADING_ENABLED: ${SWING_TRADING_ENABLED:-true}
    volumes:
      - swing_bot_data:/data

  # ─── impulse-bot: удар на perp-альтах (CScalp лента+кластер) ───────────
  # Изолирован от scalp/horizon. Демо, ключи по умолчанию = SCALP_*.
  # Чужие позиции на общем счёте не трогает. STRATEGY_RATIONALE_IMPULSE.md
  impulse-bot:
    build:
      context: .
      dockerfile: Dockerfile.impulse-bot
    image: impulse-bot:local
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - .env
    environment:
      IMPULSE_DATA_DIR: /data
      IMPULSE_LOG_LEVEL: ${IMPULSE_LOG_LEVEL:-INFO}
      IMPULSE_BYBIT_API_KEY: ${IMPULSE_BYBIT_API_KEY:-${SCALP_BYBIT_API_KEY:-}}
      IMPULSE_BYBIT_API_SECRET: ${IMPULSE_BYBIT_API_SECRET:-${SCALP_BYBIT_API_SECRET:-}}
      IMPULSE_BYBIT_DEMO: ${IMPULSE_BYBIT_DEMO:-${SCALP_BYBIT_DEMO:-true}}
      IMPULSE_TRADING_ENABLED: ${IMPULSE_TRADING_ENABLED:-true}
      IMPULSE_VIRTUAL_CAPITAL: ${IMPULSE_VIRTUAL_CAPITAL:-1000}
      IMPULSE_TELEGRAM_ENABLED: ${IMPULSE_TELEGRAM_ENABLED:-true}
      IMPULSE_TELEGRAM_BOT_TOKEN: ${IMPULSE_TELEGRAM_BOT_TOKEN:-${SCALP_TELEGRAM_BOT_TOKEN:-}}
      IMPULSE_TELEGRAM_CHAT_ID: ${IMPULSE_TELEGRAM_CHAT_ID:-${SCALP_TELEGRAM_CHAT_ID:-}}
    volumes:
      - impulse_bot_data:/data

  # ─── solana-bot: щитки Solana (скан; свап выкл. без ключа) ─────────────
  # Отдельный пакет. solders только в этом образе. STRATEGY_RATIONALE_SOLANA.md
  solana-bot:
    profiles: ["solana"]
    build:
      context: .
      dockerfile: Dockerfile.solana-bot
    image: solana-bot:local
    restart: unless-stopped
