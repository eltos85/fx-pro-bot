[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fx-pro-bot"
version = "0.8.0"
description = "Сканер-советник: ансамбль + Leaders + Outsiders(confirmed) + Shadow + Scalping + cTrader auto-trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "yfinance>=0.2.40",
  "requests>=2.31",
  "cot-reports>=0.1",
  "beautifulsoup4>=4.12",
  "ctrader-open-api>=0.9.2",
  "service-identity>=24.1.0",
  "pybit>=5.9.0",
  "statsmodels>=0.14",
  "anthropic>=0.39.0",
  "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
token-service = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
fx-pro-bot = "fx_pro_bot.app.main:main"
fx-pro-stats = "fx_pro_bot.app.stats_cli:main"
fx-pro-auth = "fx_pro_bot.app.auth_cli:main"
fx-ai-trader = "fx_ai_trader.app.main:run"
scalp-bot = "scalp_bot.app.main:run"
daytrend-bot = "horizon_bot.app.main:run"
swing-bot = "horizon_bot.app.main:run"
flowzone-bot = "flowzone_bot.app.main:run"
tradecard-bybit = "tradecard_bybit.app.main:run"
tradecard-momentum = "tradecard_momentum.app.main:run"
fx-momentum-bot = "fx_momentum_bot.app.main:run"
ru-stocks-analyst = "ru_stocks_analyst.app.main:run"
ru-stocks-discover = "ru_stocks_analyst.app.discover_accounts:main"
ru-stocks-once = "ru_stocks_analyst.app.run_once:main"
ctrader-token-service = "ctrader_token_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/fx_pro_bot",
  "src/fx_ai_trader",
  "src/scalp_bot",
  "src/horizon_bot",
  "src/flowzone_bot",
  "src/tradecard_bybit",
  "src/tradecard_momentum",
  "src/fx_momentum_bot",
  "src/ru_stocks_analyst",
  "src/shared_oauth",
  "src/ctrader_token_service",
]

[tool.ruff]
line-length = 100
target-version = "py311"
